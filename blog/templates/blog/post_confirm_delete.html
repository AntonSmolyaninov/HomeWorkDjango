{% extends "base.html" %}

{% block title %}Удалить пост{% endblock %}

{% block content %}
<h1>Удалить пост "{{ object.title }}"?</h1>

<form method="post">
  {% csrf_token %}
  <button type="submit">Подтвердить удаление</button>
  <a href="{% url 'blog:post_detail' object.pk %}">Отмена</a>
</form>
{% endblock %}
