{% extends 'base.html' %}

{% block title %}Выход из системы{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Выход из системы</h3>
            </div>
            <div class="card-body text-center">
                <div class="alert alert-success">
                    <h4 class="alert-heading">Вы успешно вышли из системы!</h4>
                    <p>Спасибо, что посетили наш сайт. Ждем вас снова!</p>
                </div>
                
                <div class="mt-3">
                    <a href="{% url 'users:login' %}" class="btn btn-primary">Войти снова</a>
                    <a href="/" class="btn btn-secondary">На главную</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
