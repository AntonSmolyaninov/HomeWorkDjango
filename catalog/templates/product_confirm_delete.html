{% extends "base.html" %}
{% block title %}Удаление продукта{% endblock %}

{% block content %}
<h1>Удалить продукт "{{ object.name_product }}"?</h1>

<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Да, удалить</button>
  <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
